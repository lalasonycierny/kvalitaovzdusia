name: Zber meraní

on:
  schedule:
    - cron: "*/15 * * * *"     # každých 15 minút (GitHub môže spustenie o pár minút oneskoriť)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zber
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r collector/requirements.txt

      - name: Stiahnuť a uložiť merania
        run: python collector/collect.py

      - name: Prepočítať denné štatistiky
        run: python collector/stats.py

      - name: Uložiť zmeny do repozitára
        run: |
          git config user.name  "zber-bot"
          git config user.email "zber-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Žiadne zmeny."
          else
            git commit -m "Merania $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
